name: urbanos

services:
  db:
    image: postgis/postgis:17-3.5
  
    platform: linux/amd64
    container_name: urbanos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    ports:

      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - urbanos_db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  urbanos_db_datos: